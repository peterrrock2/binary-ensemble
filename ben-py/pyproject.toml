[build-system]
requires    = ["maturin>=0.14"]    # maturin itself (and its deps) will drive the build
build-backend = "maturin"


[project]
name = "binary-ensemble"
dynamic = ["version"]
description = "Python bindings for the Binary Ensemble Package."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
]


[tool.maturin]
python-source = "."
module-name = "binary_ensemble._core"
bindings = "pyo3"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*XBEN may take a second*:UserWarning",
]

[project.optional-dependencies]
# Render the site (used by ReadTheDocs). Notebook outputs are rendered from the
# committed .ipynb files, so no execution dependencies are needed here.
docs = [
  # Sphinx core + a modern theme
  "sphinx>=8.2.3",
  "furo>=2024.8.6",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.6.1",
  "sphinxext-opengraph>=0.9.1",
  # MyST markdown + notebook rendering
  "myst-nb>=1.3.0",
  "linkify-it-py>=2.0.3",
]
# Extra deps to *execute* the tutorial notebooks (used by CI and local verification
# with NB_EXECUTION_MODE=cache), so every example is run end to end.
docs-exec = [
  "ipykernel>=6.29.5",
  "gerrychain>=0.3.2",
  "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "gerrychain[geo]>=0.3.2",
    "ipykernel>=7.0.1",
    "ipywidgets>=8.1.7",
    "maturin>=1.9.6",
    "pytest>=8.4.2",
    "ruff>=0.11.0",
    "tqdm>=4.67.1",
]
